<title>Debye partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B1018; --paper: #FAF8F5; --card: #FDFCFA; --body: #5A4744; --muted: #8E807A; --beige: #EFE8DF; --beige-d: #E2D8CB;
    --line: rgba(74,20,36,.10); --sep: rgba(74,20,36,.14);
    --heat: #6B1F33; --heat-text: #6B1F33; --tint: #F5EBED;
    --ok: #2F7D4F; --ok-tint: #E7F3EB; --orange: #B04A12; --orange-tint: #FBEDE3;
    --red: #C0262D; --red-tint: #FCE9EA; --blue: #34508C; --blue-tint: #E9EEF8; --ink2: #E8E8ED;
    --fill: #EFE8DF; --fill2: #F3EEE7;
    --shadow: 0 0 0 1px rgba(74,20,36,.10), 0 1px 3px rgba(43,16,24,.03);
    --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    --sysd: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sys); background: var(--paper); color: var(--ink); font-size: 14px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-family: var(--sysd); margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  button { font-family: var(--sys); cursor: pointer; }
  input, select, textarea { font-family: var(--sys); font-size: 14px; color: var(--ink); }
  .gray { color: var(--muted); font-weight: 400; }
  .muted { color: var(--muted); }


  .card { background: var(--card); border: 0; border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card h3 { font-size: 17px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .pill, .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 980px; background: var(--fill2); border: 0; color: var(--body); white-space: nowrap; }
  .pill.hot, .badge.hot { background: var(--tint); color: var(--heat); }
  .pill.warn { background: var(--orange-tint); color: var(--orange); }
  .pill.ok, .badge.ok { background: var(--ok-tint); color: var(--ok); }
  .pill.blue { background: var(--blue-tint); color: var(--blue); }
  .pill.wait { background: var(--fill2); color: var(--body); }
  .pill.red { background: var(--red-tint); color: var(--red); }

  .btn, .opt { padding: 9px 16px; border-radius: 980px; border: 0; background: var(--fill); font-weight: 500; font-size: 14px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
  .btn:hover, .opt:hover { background: var(--beige-d); }
  .btn.primary, .opt.primary { background: var(--heat); color: #fff; }
  .btn.primary:hover, .opt.primary:hover { background: #571828; }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .btn:disabled, .opt:disabled { opacity: .35; cursor: default; }

  .lcd { background: #9FB7A4; border: 3px solid #5E6B60; border-radius: 6px; padding: 3px 9px; font: 700 19px "Courier New", monospace; color: #1E2A21; letter-spacing: 2px; }
  .boiler { width: 112px; height: 78px; background: #F4F2EE; border-radius: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.16); display: grid; place-items: center; }
  .mixer { width: 88px; height: 88px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FAFAFA, #A9ADB3); box-shadow: 0 6px 14px rgba(0,0,0,.18); }
  .shot { border-radius: 14px; background: linear-gradient(160deg, #E3E3E8, #C9C9CF); display: grid; place-items: center; }

  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 500; }
  .reg { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 50px); }
  .reg-side { background: var(--card); border-right: .5px solid var(--sep); color: var(--body); padding: 40px 32px; display: flex; flex-direction: column; gap: 22px; }

  .reg-side h1 { color: var(--ink); font-size: 30px; font-weight: 700; line-height: 1.15; }
  .reg-side p { margin: 0; line-height: 1.6; }
  .why { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; line-height: 1.45; }
  .why li { display: flex; gap: 10px; } .why b { color: var(--ink); font-weight: 600; }
  .rsteps { list-style: none; padding: 4px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 2px; background: var(--paper); border-radius: 14px; }
  .rsteps li { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--muted); font-weight: 500; }
  .rsteps li .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1.5px solid #D1D1D6; font-size: 11px; font-weight: 700; flex: none; }
  .rsteps li.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .rsteps li.on .n { background: var(--heat); border-color: var(--heat); color: #fff; }
  .rsteps li.done { color: var(--ink); }
  .rsteps li.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }

  .reg-main { padding: 40px 56px 64px; max-width: 980px; }
  .reg-main .eyebrow { font-size: 13px; font-weight: 600; color: var(--heat-text); }
  .reg-main h2 { font-size: 34px; font-weight: 700; margin: 4px 0 8px; }
  .reg-main .lead { color: var(--body); margin: 0 0 26px; line-height: 1.5; font-size: 15px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  .f { display: flex; flex-direction: column; gap: 6px; }
  .f.full { grid-column: 1 / -1; }
  .f label { font-size: 13px; font-weight: 500; color: var(--body); }
  .f label .req { color: var(--red); }
  .f small { color: var(--muted); font-size: 12px; }
  .f input, .f select, .f textarea { padding: 10px 12px; border-radius: 10px; border: .5px solid rgba(0,0,0,.18); background: var(--card); outline: none; transition: box-shadow .15s, border-color .15s; }
  .f input:focus, .f select:focus, .f textarea:focus { border-color: var(--heat); box-shadow: 0 0 0 3.5px rgba(107,31,51,.25); }
  .f input.bad { border-color: var(--red); box-shadow: 0 0 0 3px rgba(255,59,48,.15); }
  .sec { grid-column: 1 / -1; font: 600 17px var(--sysd); margin-top: 12px; padding-top: 16px; border-top: .5px solid var(--sep); }
  .sec:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .cb { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 980px; background: var(--fill); font-weight: 500; cursor: pointer; transition: background .15s; }
  .cb.on { background: var(--heat); color: #fff; }
  .cb input { display: none; }
  .upl { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1.5px dashed rgba(0,0,0,.14); border-radius: 12px; background: var(--card); }
  .upl.done { border: 0; background: var(--ok-tint); }
  .agree { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 12px; background: var(--card); line-height: 1.45; cursor: pointer; box-shadow: 0 0 0 .5px rgba(0,0,0,.12); }
  .agree input { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--heat); }
  .team-row { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr auto; gap: 10px; align-items: end; }
  .reg-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; padding-top: 20px; border-top: .5px solid var(--sep); }
  .err { color: var(--red); font-weight: 500; }
  .review { max-width: 660px; }
  .review ul { list-style: none; padding: 0; margin: 20px 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .review li { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-top: .5px solid var(--sep); }
  .review li:first-child { border-top: 0; }

  main { padding: 26px 34px 64px; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; gap: 16px; }
  .head h1 { font-size: 30px; font-weight: 700; }
  .head p { margin: 4px 0 0; color: var(--body); font-size: 15px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .kpi { background: var(--card); border-radius: 16px; padding: 18px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s; }
  .kpi:hover { transform: translateY(-1px); }
  .kpi b { display: block; font: 700 30px var(--sysd); letter-spacing: -0.02em; margin-top: 6px; }
  .kpi span { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }

  .job { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .job + .job { margin-top: 18px; }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: .5px solid var(--sep); }
  .job-top h3 { font-size: 20px; margin-top: 6px; }
  .job-top .meta { color: var(--muted); margin-top: 3px; }
  .job-body { display: grid; grid-template-columns: 200px 1fr; gap: 20px; padding: 18px 20px; }
  .job .shot { height: 130px; }
  .boiler { width: 110px; height: 76px; }
  .lcd { font-size: 18px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; text-align: left; }
  .job-act { display: flex; gap: 10px; align-items: center; padding: 14px 20px; background: var(--paper); border-top: .5px solid var(--sep); flex-wrap: wrap; }
  .job-act select { padding: 7px 10px; border-radius: 8px; border: .5px solid rgba(0,0,0,.18); background: var(--card); }

  .story { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 18px 20px; border-top: .5px solid var(--sep); }
  .story h4 { font-size: 15px; margin: 0 0 10px; }
  .sum { margin: 0; padding-left: 18px; line-height: 1.55; color: var(--body); }
  .sum li + li { margin-top: 4px; }
  .story .also { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--orange-tint); color: #8A3A00; line-height: 1.5; }
  .story .also b { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .tx { margin-top: 12px; }
  .tx summary, .wipstory > summary { cursor: pointer; font-weight: 500; color: var(--heat); list-style: none; }
  .tx summary::before, .wipstory > summary::before { content: "›"; display: inline-block; margin-right: 8px; transition: transform .15s; }
  .tx[open] summary::before, .wipstory[open] > summary::before { transform: rotate(90deg); }
  .wipstory { border-top: .5px solid var(--sep); }
  .wipstory > summary { padding: 13px 20px; }
  .wipstory .story { border-top: 0; }
  .tx-body { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; max-height: 300px; overflow-y: auto; padding: 12px; background: #EFEAE2; border-radius: 14px; }
  .tx-line { max-width: 85%; padding: 7px 11px; border-radius: 16px; background: var(--card); line-height: 1.4; box-shadow: 0 1px .5px rgba(0,0,0,.1); }
  .tx-line.t { align-self: flex-end; background: #D9FDD3; }
  .tx-who { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
  .story .concl { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; background: var(--paper); border-radius: 12px; margin-bottom: 10px; }
  .story .concl > span { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .meter { width: 80px; height: 6px; border-radius: 980px; background: rgba(0,0,0,.08); overflow: hidden; display: inline-block; }
  .meter i { display: block; height: 100%; background: var(--heat); border-radius: 980px; }
  .reason { list-style: none; margin: 0; padding: 0; }
  .reason li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 8px 0; border-top: .5px solid var(--sep); line-height: 1.4; color: var(--body); }
  .reason li:first-child { border-top: 0; }
  .reason b { color: var(--ink); font-weight: 600; }
  .reason .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
  .reason .y .ic { background: var(--ok); color: #fff; }
  .reason .n .ic { background: var(--fill); color: var(--muted); }

  .track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin: 0 20px 16px; padding: 3px; background: var(--fill); border-radius: 11px; }
  .track div { padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
  .track div.done { color: var(--ok); }
  .track div.now { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .report { padding: 16px 20px; border-top: .5px solid var(--sep); display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .report .full { grid-column: 1 / -1; }

  .avail { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 4px; }
  .avail .h { font-size: 12px; font-weight: 600; color: var(--body); text-align: center; padding: 6px 0; }
  .avail .t { font-size: 12px; color: var(--muted); display: flex; align-items: center; }
  .avail button { height: 38px; border-radius: 9px; border: 0; background: var(--fill2); font-size: 11px; font-weight: 600; color: var(--muted); }
  .avail button.off { background: repeating-linear-gradient(45deg, var(--fill2), var(--fill2) 5px, var(--beige) 5px, var(--beige) 10px); color: var(--muted); cursor: default; }
  .avail button.h { height: auto; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 6px; color: var(--muted); font-weight: 500; font-size: 11.5px; border-radius: 8px; }
  .avail button.h b { color: var(--ink); font-size: 13px; }

  if (t.dataset.bind && t.type === 'checkbox') P.profile[t.dataset.bind] = t.checked;
  if (t.dataset.arr) { const a = P.profile[t.dataset.arr]; const i = a.indexOf(t.value); if (t.checked && i < 0) a.push(t.value); if (!t.checked && i >= 0) a.splice(i, 1); render(); }
  if (t.dataset.req) commit(st => { const r = pdata().requests.find(x => x.id === t.dataset.req); const i = r.picked.indexOf(t.value); if (t.checked && i < 0) r.picked.push(t.value); if (!t.checked && i >= 0) r.picked.splice(i, 1); }); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.tagName === 'A') e.preventDefault();
  const id = b.dataset.id, act = b.dataset.act;
  switch (act) {
    case 'toRegister': P.view = 'register'; P.step = 0; P.review = false; P.errors = []; P.profile = JSON.parse(JSON.stringify(EMPTY)); break;
    case 'toLogin': P.view = 'login'; P.loginErr = ''; break;
    case 'toLanding': P.view = 'landing'; break;
    case 'login': { const em = $('lemail').value.trim().toLowerCase(), pw = $('lpass').value; const q = ST.partners.find(x => x.email.toLowerCase() === em);
      if (!q || !pw) { P.loginErr = !q ? 'No partner account with this email.' : 'Enter your password.'; break; }
      sessionStorage.setItem('debye_pid', q.id); P.profile = profileOf(q.id); P.view = 'portal'; P.tab = 'overview'; break; }
    case 'logout': sessionStorage.removeItem('debye_pid'); P.view = 'landing'; break;
    case 'next': if (!validate(P.step)) return render(); if (P.step < STEPS.length - 1) P.step++; else P.review = true; window.scrollTo(0, 0); break;
    case 'back': P.errors = []; if (P.step === 0) P.view = 'landing'; else P.step--; break;
    case 'doc': P.profile.docs[id] = id.replace('doc_', '') + '_2026.pdf'; break;
    case 'undoc': delete P.profile.docs[id]; break;
    case 'addteam': P.profile.team.push({ name: '', phone: '', qual: '' }); break;
    case 'rmteam': P.profile.team.splice(+id, 1); break;
    case 'enter': { const p = P.profile; const pid = 'p_' + p.company_name.toLowerCase().replace(/gmbh|ug|gbr|e\.k\./g, '').trim().replace(/[^a-z0-9]+/g, '_').replace(/_+$/, '') + '_' + Date.now().toString(36).slice(-3);
      commit(st => { st.partners.push({ id: pid, name: p.company_name, short: p.company_name.replace(/ GmbH| UG| GbR/, ''), email: p.email, city: p.city, trades: p.trades.map(k => (TRADES.find(t => t[0] === k) || [k, k])[1]),
        brands: p.brands, techs: p.team.filter(t => t.name).map(t => t.name), dist: '–', rating: '–', jobs: 0, ftf: '–', resp: p.response, status: 'verified', mobile: p.mobile, since: new Date().toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) });
        st.profiles = st.profiles || {}; st.profiles[pid] = p; });
      sessionStorage.setItem('debye_pid', pid); P.view = 'portal'; P.tab = 'overview'; break; }
    case 'tab': P.tab = id; P.reportOpen = null; window.scrollTo(0, 0); break;
    case 'accept': { const tech = ($('tech_' + id) || {}).value || (P.profile.team[0] || {}).name || 'Technician', slot = ($('time_' + id) || {}).value;
      withJob(id, (j, c) => { if (c) partnerAccept(c, slot, tech); else { j.tech = tech; j.slot = slot; j.status = 'accepted'; } });
      toast(`Accepted · ${slot} proposed · the tenant confirms on WhatsApp`);
      setTimeout(() => commit(st => { const j = (st.partnerJobs[PID()] || []).find(x => x.id === id); if (j && j.status === 'accepted') j.status = 'scheduled'; }), 6000);
      P.tab = 'wip'; break; }
    case 'decline': { const why = $('why_' + id).value; if (!why) { toast('Pick a reason first'); return; } withJob(id, (j, c) => { if (c) partnerDecline(c, why); else j.status = 'declined'; }); toast('Declined · offered to the next partner'); break; }
    case 'advance': withJob(id, (j, c) => { const cur = c ? c.job.status : j.status; const i = TRACK.findIndex(t => t[0] === cur); const nx = TRACK[i + 1][0]; if (c) setJobStatus(c, nx); else j.status = nx; }); toast('Status updated · tenant notified'); break;
    case 'report': P.reportOpen = id; break;
    case 'complete': { const w = $('rw_' + id).value, pa = $('rp_' + id).value; withJob(id, (j, c) => { if (c) completeJob(c, w, pa); else { j.work = w; j.parts = pa; j.status = 'completed'; j.completedAt = 'Today ' + nowT(); } });
      P.reportOpen = null; P.tab = 'done'; P.invoiceOpen = id; P.invoiceRead = false; toast('Job report sent · now add the invoice'); break; }
    case 'openinv': P.invoiceOpen = id; P.invoiceRead = false; break;
    case 'closeinv': P.invoiceOpen = null; break;
    case 'submitinv': { const no = $('invNo').value; withJob(id, (j, c) => { const src = c ? jobFromCase(c) : j; const net = src.invNet || 100, vat = Math.round(net * 19) / 100, inv = { no, net, vat, total: Math.round((net + vat) * 100) / 100 };
        if (c) submitInvoice(c, inv); else { j.invoice = inv; j.status = 'invoiced'; } }); P.invoiceOpen = null; toast('Invoice submitted · approved'); break; }
    case 'cell': commit(st => { const d = pdata(); const [di, bi] = id.split('_'); const day = weekDays(P.week).find(x => x.iso === di); d.slots[id] = !isFree(d, day, +bi); }); return;
    case 'day': commit(st => { const d = pdata(); const day = weekDays(P.week).find(x => x.iso === id); const all = BLOCKS.every((b, bi) => isFree(d, day, bi)); BLOCKS.forEach((b, bi) => d.slots[id + '_' + bi] = !all); }); return;
    case 'week': P.week = id === '0' ? 0 : Math.max(0, P.week + +id); break;
    case 'copyweek': commit(st => { const d = pdata(), a = weekDays(P.week), b2 = weekDays(P.week + 1); a.forEach((x, i) => BLOCKS.forEach((b, bi) => d.slots[b2[i].iso + '_' + bi] = isFree(d, x, bi))); }); P.week++; toast('Copied to the next 7 days'); break;
    case 'clearweek': commit(st => { const d = pdata(); weekDays(P.week).forEach(x => BLOCKS.forEach((b, bi) => d.slots[x.iso + '_' + bi] = false)); }); return;
    case 'sendreq': commit(st => { pdata().requests.find(r => r.id === id).sent = true; }); toast('Slots sent to Debye'); return;
    case 'addoff': { const f = $('offFrom').value, t = $('offTo').value; if (!f || !t) { toast('Pick both dates'); return; } const why = $('offWhy').value || 'Time off'; commit(st => pdata().timeoff.push({ from: f, to: t, why })); return; }
    case 'rmoff': commit(st => pdata().timeoff.splice(+id, 1)); return;
    case 'save': { const p = P.profile; commit(st => { st.profiles = st.profiles || {}; st.profiles[PID()] = p; const q = st.partners.find(x => x.id === PID()); if (q) { q.name = p.company_name; q.mobile = p.mobile; q.email = p.email || q.email; } }); toast('Saved'); return; }
    default: return;
  }
  render();
});
render();
</script>
