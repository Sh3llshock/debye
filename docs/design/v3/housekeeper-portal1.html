  header { display: flex; align-items: center; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
  .tbrand { display: flex; align-items: center; gap: 9px; font: 600 19px var(--sysd); text-decoration: none; }
  .tbrand small { font: 500 12px var(--sys); color: var(--muted); margin-left: 2px; }
  .tabs { display: flex; gap: 4px; margin-left: 20px; }
  .tab { text-decoration: none; color: var(--body); padding: 7px 14px; border-radius: 980px; font-size: 14px; font-weight: 500; display: flex; gap: 7px; align-items: center; }
  .tab:hover { background: var(--beige); } .tab.on { background: var(--wine-tint); color: var(--wine); }
  .cnt { font-size: 11px; font-weight: 700; background: var(--wine); color: #FDFAF7; border-radius: 980px; padding: 1px 7px; }
  .cnt.soft { background: var(--beige-d); color: var(--body); }
  .search { margin-left: auto; background: var(--surface); box-shadow: 0 0 0 1px var(--line); border-radius: 980px; padding: 8px 14px; color: var(--muted); width: 260px; font-size: 13px; }
  .me { display: flex; align-items: center; gap: 9px; font-weight: 500; white-space: nowrap; }
  .uav { width: 32px; height: 32px; border-radius: 50%; background: var(--wine); color: #FDFAF7; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
  .zero { font-size: 12px; color: var(--muted); white-space: nowrap; } .zero b { color: var(--wine); }

  main { flex: 1; min-height: 0; overflow-y: auto; }
  .page { max-width: 1320px; margin: 0 auto; padding: 26px 28px 60px; }
  .ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
  .ph h1 { font-size: 30px; font-weight: 700; } .ph p { margin: 4px 0 0; color: var(--body); }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; } .crumb a { text-decoration: none; } .crumb a:hover { color: var(--wine); }
  .card { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(43,16,24,.03); padding: 20px; }
  .card + .card { margin-top: 16px; }
  .card h3 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sub { color: var(--muted); font-size: 13px; margin: -8px 0 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 980px; background: var(--beige); color: var(--body); white-space: nowrap; }
  .pill.hot { background: var(--wine-tint); color: var(--wine); } .pill.ok { background: var(--ok-tint); color: var(--ok); } .pill.blue { background: var(--blue-tint); color: var(--blue); }
  .pill.red { background: var(--red-tint); color: var(--red); } .pill.wait { background: var(--beige); color: var(--body); } .pill.warn { background: var(--warn-tint); color: var(--warn); }
  .btn { border: 0; padding: 9px 16px; border-radius: 980px; font-weight: 500; font-size: 14px; background: var(--beige); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--beige-d); }
  .btn.primary { background: var(--wine); color: #FDFAF7; } .btn.primary:hover { background: var(--wine-d); }
  .btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line); }
  .gray { color: var(--muted); }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(107,31,51,.035); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mini { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 120px; }
  .mini i { height: 4px; border-radius: 2px; background: var(--beige-d); } .mini i.d { background: var(--ok); } .mini i.n { background: var(--wine); }
  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; } dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; text-align: right; font-weight: 500; }

  /* ---------- inbox (Outlook-style) ---------- */
  .inbox { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  .ilist { border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg); }
  .ihead { padding: 18px 18px 10px; display: flex; justify-content: space-between; align-items: center; }
  .ihead h2 { font-size: 20px; }
  .ifilter { display: flex; gap: 6px; padding: 0 18px 10px; }
  .ifilter button { border: 0; background: transparent; padding: 5px 11px; border-radius: 980px; font-size: 13px; color: var(--body); }
  .ifilter button.on { background: var(--wine-tint); color: var(--wine); font-weight: 600; }
  .irow { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); cursor: pointer; position: relative; }
  .irow:hover { background: rgba(107,31,51,.035); } .irow.on { background: var(--wine-tint); }
  .irow.unread::before { content: ""; position: absolute; left: 6px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--wine); }
  .irow .who { font-weight: 600; font-size: 14px; } .irow .ttl { font-size: 13.5px; margin-top: 1px; }
  .irow .pv { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; margin-top: 2px; }
  .irow .rt { text-align: right; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ch { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 6px; } .ch.WhatsApp { background: #E6F4EA; color: #1E7A35; } .ch.Website { background: var(--blue-tint); color: var(--blue); }
  .iread { overflow-y: auto; padding: 24px 30px 40px; }
  .rhead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
  .rhead h2 { font-size: 24px; } .rhead p { margin: 4px 0 0; color: var(--muted); }
  .summary { background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line); padding: 18px 20px; margin-bottom: 18px; }
  .summary h4 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 8px; letter-spacing: 0; }
  .sumgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
  .sumgrid b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
  .conf { height: 6px; border-radius: 980px; background: var(--beige-d); overflow: hidden; margin-top: 6px; width: 160px; } .conf i { display: block; height: 100%; background: var(--wine); }
  .chat { display: flex; flex-direction: column; gap: 8px; background: #EFEAE2; border-radius: 16px; padding: 16px; max-height: 520px; overflow-y: auto; }
  .bb { max-width: 78%; padding: 8px 12px; border-radius: 12px; background: #FDFCFA; font-size: 14px; line-height: 1.45; box-shadow: 0 1px .5px rgba(0,0,0,.1); }
  .bb.t { align-self: flex-end; background: #D9FDD3; }
  .bb small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; text-align: right; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }

  /* ---------- case ---------- */
  .cgrid { display: grid; grid-template-columns: 1fr 400px; gap: 18px; align-items: start; }
  .flow { list-style: none; margin: 0; padding: 0; }
  .flow > li { display: grid; grid-template-columns: 28px 1fr; gap: 14px; position: relative; padding-bottom: 22px; }
  .flow > li:last-child { padding-bottom: 0; }
  .flow > li::before { content: ""; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--beige-d); }
  .flow > li:last-child::before { display: none; } .flow > li.done::before { background: var(--ok-line); }
  .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--bg); color: var(--muted); border: 1.5px solid var(--beige-d); position: relative; z-index: 1; }
  .done .dot { background: var(--ok); color: #fff; border-color: var(--ok); }
  .now .dot { background: var(--wine); color: #fff; border-color: var(--wine); box-shadow: 0 0 0 5px var(--wine-tint); }
  .r1 { display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; } .r1 b { font-size: 15px; font-weight: 600; }
  .r1 .mod { font-size: 11px; color: var(--muted); margin-left: 8px; } .r1 time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pending .r1 b { color: var(--muted); font-weight: 500; }
  .what { color: var(--body); margin-top: 4px; line-height: 1.5; }
  .evi { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
  .evi li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; line-height: 1.4; }
  .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 1px; }
  .ic.y { background: var(--ok); color: #fff; } .ic.n { background: var(--beige-d); color: var(--body); } .ic.i { background: var(--warn); color: #fff; }
  .pcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .pc { border-radius: 14px; padding: 14px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; }
  .pc.rec { background: var(--surface); box-shadow: 0 0 0 2px var(--wine), 0 6px 18px rgba(107,31,51,.10); }
  .pc .rb { align-self: flex-start; font-size: 11px; font-weight: 700; color: #FDFAF7; background: var(--wine); border-radius: 980px; padding: 2px 9px; }

function caseSteps(c) {
  const p = prop(c.propertyId), pn = c.partnerId ? partner(c.partnerId).short : '', s = c.stage;
  const order = ['diag', 'avail', 'approval', 'partner', 'confirm', 'booked', 'feedback', 'closed'], i = order.indexOf(s);
  const st = k => { const j = order.indexOf(k); return i > j ? 'done' : i === j ? 'now' : 'pending'; };
  const icons = { yes: 'y', no: 'n', info: 'i' };
  const steps = [{ s: 'done', t: 'Case opened', m: 'Input', time: c.opened, body: `<div class="what">“${esc(c.problem)}” · via ${c.channel}. Recognised ${esc(p.tenant)} by phone number.</div>` }];
  if (s === 'emergency') { steps.push({ s: 'now', t: 'Emergency: gas smell', m: 'Safety', time: c.events[0].t, body: `<div class="emerg"><div><b style="color:var(--red)">Tenant reports gas smell</b><br><span class="gray">Told to leave the flat and call the gas emergency line.</span></div><a class="btn primary" href="tel:${esc(p.phone)}">Call ${esc(firstName(p.tenant))}</a></div>` }); return steps; }
  steps.push({ s: s === 'diag' ? 'now' : 'done', t: s === 'diag' ? 'Diagnosis in progress' : 'Diagnosis', m: 'Missing data · Classifier', time: s === 'diag' ? `question ${c.asked}` : '',
    body: `${c.hyp ? `<div class="what"><b style="color:var(--ink)">${esc(c.hyp.t)}</b> · ${c.hyp.c}% sure</div>` : ''}<ul class="evi">${c.evidence.map(e => `<li><span class="ic ${icons[e.kind]}">${e.kind === 'no' ? '✗' : e.kind === 'info' ? '!' : '✓'}</span><span>${esc(e.text)}</span></li>`).join('')}</ul>` });
  if (s === 'resolved') { steps.push({ s: 'done', t: 'Fixed by the tenant', m: 'Closing', time: c.events[0].t, body: `<div class="what">${esc(c.fix)} No technician, no cost.</div>` }); return steps; }
  if (i < 1) return steps;
  steps.push({ s: st('avail'), t: 'Tenant’s rough times', m: 'Time availability', time: '', body: c.availSel.length && i > 1 ? `<div class="what">${esc(c.availSel.map(id => AV.find(a => a.id === id).l).join(', '))}</div>` : '<div class="what gray">Waiting for the tenant</div>' });
  if (i < 2) return steps;
  steps.push({ s: s === 'approval' ? 'now' : s === 'rejected' ? 'pending' : 'done', t: s === 'approval' ? 'Choose a partner' : s === 'rejected' ? 'Handled by you' : `Partner chosen: ${pn}`, m: 'Matching · Approval', time: c.approval ? c.approval.t : '',

      : `<div class="what">${esc(c.approval.by)} · ${eur0(c.approval.amount)}${c.partnerId !== c.ranking[0].id ? ' · not the recommended partner' : ' · recommended partner'}</div>` });
  if (s === 'rejected') return steps;
  steps.push({ s: st('partner'), t: s === 'partner' ? `Waiting for ${pn}` : `${pn} accepted`, m: 'Order job', time: '', body: c.proposal ? `<div class="what">${esc(c.tech)} proposed ${esc(c.proposal)}</div>` : `<div class="what gray">Job sent to ${esc(pn)}. 2 hours to accept.${c.job.declined.length ? ' Declined by ' + c.job.declined.map(x => partner(x).short).join(', ') + '.' : ''}</div>` });
  steps.push({ s: st('confirm'), t: 'Tenant confirmed the time', m: 'Order confirmation', time: '', body: c.slot ? `<div class="what">${esc(c.slot)} · consent recorded (${esc(c.consent.fields.join(', '))})</div>` : '' });
  const vs = { scheduled: 'Scheduled', on_the_way: 'Technician on the way', on_site: 'Technician on site', completed: 'Repair done', invoiced: 'Invoice received' }[c.job.status] || '';
  steps.push({ s: s === 'closed' ? 'done' : ['booked', 'feedback'].includes(s) ? 'now' : 'pending', t: s === 'closed' ? 'Repaired and closed' : 'Visit and closing', m: 'Closing', time: c.slot || '',
    body: s === 'closed' ? `<div class="what">${esc(c.job.report.work)} Invoice ${esc(c.job.invoice.no)}: ${eur(c.job.invoice.total)}, paid by the owner.</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost">📄 Invoice</button><button class="btn ghost">📄 Repair report</button></div>`
      : ['booked', 'feedback'].includes(s) ? `<div class="what">${vs}${c.feedback === 'fixed' ? ' · tenant confirmed it’s fixed' : c.feedback === 'not' ? ' · <b style="color:var(--red)">tenant says it’s not fixed</b>' : ''}${c.job.invoice ? ` · invoice ${eur(c.job.invoice.total)}` : ''}</div>` : '' });
  return steps;
}

        <dt>Contact</dt><dd>${esc(p.contact_name || '')}${p.contact_role ? ' · ' + esc(p.contact_role) : ''}</dd><dt>Email</dt><dd>${esc(p.email || q.email)}</dd><dt>Mobile (jobs)</dt><dd>${esc(p.mobile || q.mobile || '')}</dd><dt>Office</dt><dd>${esc(p.phone_office || '–')}</dd><dt>Website</dt><dd>${esc(p.website || '–')}</dd></dl></div>
      <div class="card"><h3>Licences & insurance</h3><dl class="kv"><dt>Handwerksrolle</dt><dd>${esc(p.hwk_no || '–')} · ${esc(p.hwk_chamber || '')}</dd><dt>Master business</dt><dd>${esc(p.master || '–')}</dd>
        <dt>Gas registration</dt><dd>${p.gas_no ? esc(p.gas_no) + ' ' + exp(p.gas_valid) : '<span class="gray">None · no gas jobs</span>'}</dd><dt>Insurer</dt><dd>${esc(p.insurer || '–')} · ${esc(p.policy_no || '')}</dd>
        <dt>Coverage</dt><dd>${p.coverage_eur ? eur0(+p.coverage_eur) : '–'}</dd><dt>Insurance</dt><dd>${exp(p.ins_valid) || '–'}</dd></dl></div>
      <div class="card"><h3>Documents</h3><div class="docs">${Object.keys(DOCN).map(k => docs[k] ? `<div class="doc"><span>📄 ${DOCN[k]}</span><span class="gray">${esc(docs[k])}</span></div>` : `<div class="doc"><span class="gray">${DOCN[k]}</span><span class="pill warn">Missing</span></div>`).join('')}</div></div>
      <div class="card"><h3>Services & area</h3><div class="sub" style="margin:0 0 8px">Services</div><div class="chips">${(p.trades || []).map(t => `<span>${esc(TR[t] || t)}</span>`).join('') || q.trades.map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="sub" style="margin:14px 0 8px">Certified brands</div><div class="chips">${(p.brands || q.brands || []).map(b => `<span>${esc(b)}</span>`).join('')}</div>
        <dl class="kv" style="margin-top:14px"><dt>Area</dt><dd>${esc(p.base_postcode || '')} + ${esc(p.radius_km || '?')} km</dd><dt>Postcodes</dt><dd>${esc(p.postcodes || '–')}</dd><dt>Emergency 24/7</dt><dd>${esc(p.emergency || '–')}</dd><dt>Max jobs / day</dt><dd>${esc(p.max_jobs || '–')}</dd></dl></div>
      <div class="card"><h3>Rates & hours</h3><dl class="kv"><dt>Callout</dt><dd>€${esc(p.callout_eur || '–')}</dd><dt>Hourly</dt><dd>€${esc(p.hourly_eur || '–')}</dd><dt>Weekend surcharge</dt><dd>${esc(p.weekend_pct || 0)}%</dd><dt>Night / emergency</dt><dd>${esc(p.night_pct || 0)}%</dd>
        <dt>Mon–Fri</dt><dd>${esc(p.hours_week || '–')}</dd><dt>Saturday</dt><dd>${esc(p.hours_sat || '–')}</dd><dt>Jobs via</dt><dd>${esc(p.jobs_via || '–')}</dd><dt>Calendar</dt><dd>${p.calendar_url ? 'Connected' : 'Portal grid'}</dd></dl></div>
      <div class="card"><h3>Team, payout & agreements</h3><table class="t">${(p.team || []).filter(t => t.name).map(t => `<tr><td><b>${esc(t.name)}</b><br><span class="gray">${esc(t.qual || '')}</span></td><td class="num">${esc(t.phone || '')}</td></tr>`).join('')}</table>
        <dl class="kv" style="margin-top:14px"><dt>Account holder</dt><dd>${esc(p.account_holder || '–')}</dd><dt>IBAN</dt><dd>${esc(iban)}</dd><dt>Invoice format</dt><dd>${esc(p.invoice_format || '–')}</dd><dt>Payment terms</dt><dd>14 days</dd>
        <dt>Partner terms</dt><dd>${p.ag_terms ? '✓ Signed' : '–'}</dd><dt>GDPR data processing</dt><dd>${p.ag_dpa ? '✓ Signed' : '–'}</dd><dt>Jobs on WhatsApp</dt><dd>${p.ag_wa ? '✓ Agreed' : 'No'}</dd></dl></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Jobs with us</h3>${jobs.length ? `<table class="t"><tr><th>Case</th><th>Flat</th><th>Status</th><th class="num">Invoice</th></tr>${jobs.map(c => { const pp = prop(c.propertyId);
      return `<tr class="click" data-href="#case/${c.id}"><td><b>${esc(c.title)}</b><br><span class="gray">${c.id}</span></td><td>${esc(pp.street)} · ${esc(pp.floor)}</td><td><span class="pill ${lab(c)[1]}">${lab(c)[0]}</span></td><td class="num">${c.hist ? eur(c.total) : c.job.invoice ? eur(c.job.invoice.total) : '–'}</td></tr>`; }).join('')}</table>` : '<span class="gray">No jobs yet</span>'}</div></div>`;
}

/* =================== router =================== */
function render() {
  header();
  const [r, id] = hroute(), m = $('main');
  const keep = m.querySelector('.ilist') ? m.querySelector('.ilist').scrollTop : 0;
  m.innerHTML = r === 'case' ? viewCase(id) : r === 'cases' ? viewCases() : r === 'properties' ? viewProperties() : r === 'property' ? viewProperty(id) : r === 'partners' ? viewPartners() : r === 'partner' ? viewPartner(id) : viewInbox();
  if (m.querySelector('.ilist')) m.querySelector('.ilist').scrollTop = keep;
  const ch = m.querySelector('.chat'); if (ch) ch.scrollTop = ch.scrollHeight;
  const imp = $('imp'); if (imp) imp.onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { importRows(f.name.endsWith('.csv') ? parseCSV(t) : [].concat(JSON.parse(t))); } catch (err) { IMPORT_MSG = '<span style="color:var(--red)">Could not read the file: ' + esc(err.message) + '</span>'; render(); } }); };
}
document.addEventListener('click', e => {
  const t = e.target;
  const href = t.closest('[data-href]'); if (href) { location.hash = href.dataset.href; return; }
  const sel = t.closest('[data-sel]'); if (sel) { SEL = sel.dataset.sel; render(); return; }
  const f = t.closest('[data-filter]'); if (f) { FILTER = f.dataset.filter; SEL = null; render(); return; }
  if (t.closest('[data-showall]')) { SHOWALL = !SHOWALL; render(); return; }
  const id = hroute()[1];
  const chs = t.closest('[data-choose]'); if (chs) { commit(st => { const c = caseById(id); setPartnerChoice(c, chs.dataset.choose); approve(c, 'Ana'); }); return; }
  if (t.closest('[data-reject]')) { commit(st => rejectCase(caseById(id), 'Ana')); return; }
  const dl = t.closest('[data-dl]'); if (dl) {
    const k = dl.dataset.dl;
    if (k === 'template') download('debye-properties-template.csv', 'street;postcode;city;floor;unit;sqm;rooms;tenant;phone;owner;limit;appliance;device;year;service;access\nMusterstraße 14;52062;Aachen;1st floor left;3a;70;3;Max Muster;+49 151 11111111;Maria Becker;300;gas_combi_boiler;Vaillant ecoTEC plus;2017;1 Mar 2026;Tenant at home\n');
    else { const pids = k.startsWith('prop:') ? [k.slice(5)] : ST.properties.map(p => p.id);
      const lines = ['flat;unit;date;what;partner;total_eur;status'];
      pids.forEach(pid => { const p = prop(pid); billsOf(pid).forEach(b => lines.push([p.street + ' ' + p.floor, p.unit, b.date, b.what, partner(b.partner).name || '', b.total.toFixed(2), b.status].join(';'))); });
      download(k.startsWith('prop:') ? `debye-billing-${pids[0]}.csv` : 'debye-billing.csv', lines.join('\n') + '\n'); }
  }
});
function onStore() { render(); }
render();
</script>
