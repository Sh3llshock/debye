  /* ---------- login ---------- */
  .login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .lbox { width: 100%; max-width: 380px; text-align: center; }
  .lbox .logo { width: 64px; height: 64px; margin: 0 auto 18px; }
  .lbox h1 { font-size: 28px; margin-bottom: 6px; }
  .lbox p { color: var(--body); margin: 0 0 22px; }
  .lbox input { width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--beige-d); background: var(--surface); font-size: 15px; margin-bottom: 10px; outline: none; }
  .lbox input:focus { border-color: var(--wine); box-shadow: 0 0 0 3px rgba(107,31,51,.15); }
  .primary { width: 100%; padding: 13px; border-radius: 12px; border: 0; background: var(--wine); color: #FDFAF7; font-size: 15px; font-weight: 600; }
  .primary:hover { background: var(--wine-d); }
  .err { color: var(--red); font-size: 14px; margin: 4px 0 10px; }
  .lnote { font-size: 13px; color: var(--muted); margin-top: 16px; }

  /* ---------- app shell ---------- */
  .shell { display: flex; flex-direction: column; height: 100%; }
  .top { display: flex; align-items: center; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .tbrand { display: flex; align-items: center; gap: 9px; font: 600 19px var(--sysd); border: 0; background: none; color: var(--ink); padding: 0; }
  .tabs { display: flex; gap: 6px; margin-left: 18px; overflow-x: auto; }
  .tab { border: 0; background: transparent; color: var(--body); padding: 7px 13px; border-radius: 980px; font-size: 13.5px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .tab:hover { background: var(--beige); }
  .tab.on { background: var(--wine-tint); color: var(--wine); }
  .tab .dotst { width: 7px; height: 7px; }
  .tuser { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; white-space: nowrap; }
  .tuser span { color: var(--muted); font-size: 12.5px; }
  .tuser .logout { margin-left: 4px; }
  .app { display: grid; grid-template-columns: 1fr; flex: 1; min-height: 0; }
  .app.withpanel { grid-template-columns: 1fr 340px; }
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; min-height: 0; }
  .sbrand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font: 600 18px var(--sysd); }
  .newbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; font-size: 14px; font-weight: 500; color: var(--ink); text-align: left; }
  .newbtn:hover, .item:hover { background: rgba(107,31,51,.06); }
  .newbtn .plus { width: 22px; height: 22px; border-radius: 6px; background: var(--wine); color: #FDFAF7; display: grid; place-items: center; font-size: 15px; }
  .slabel { font-size: 12px; color: var(--muted); font-weight: 600; padding: 16px 12px 6px; }
  .list { overflow-y: auto; flex: 1; }
  .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--ink); }
  .item.on { background: rgba(107,31,51,.10); }
  .item small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dotst { width: 7px; height: 7px; border-radius: 50%; background: var(--wine); }
  .dotst.ok { background: var(--ok); } .dotst.wait { background: #C9B9A6; }
  .user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--line); margin-top: 8px; }
  .uav { width: 32px; height: 32px; border-radius: 50%; background: var(--wine); color: #FDFAF7; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .user b { display: block; font-size: 14px; } .user span { font-size: 12px; color: var(--muted); }
  .logout { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 12px; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .topline { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .back { border: 0; background: var(--beige); color: var(--body); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
  .topline b { font: 600 18px var(--sysd); }
  .mini { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 12px; }
  .mini i { height: 4px; border-radius: 2px; background: var(--beige-d); } .mini i.d { background: var(--ok); } .mini i.n { background: var(--wine); }
  .closedlist { margin-top: 26px; }
  .closedlist .cl { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; font-size: 14px; border: 0; background: transparent; width: 100%; text-align: left; color: var(--ink); }
  .closedlist .cl:hover { background: var(--beige); } .closedlist .cl span { color: var(--muted); font-size: 13px; }
  .topline b { font-weight: 600; } .topline span { color: var(--muted); font-size: 13px; }
  .stpill { margin-left: auto; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 980px; background: var(--wine-tint); color: var(--wine); }
  .stpill.ok { background: var(--ok-tint); color: var(--ok); }

  /* ---------- home (ChatGPT start) ---------- */
  .homewrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 9vh 24px 40px; }
  .hello { text-align: center; margin-bottom: 26px; }
  .hello .logo { width: 52px; height: 52px; margin: 0 auto 16px; }
  .hello h1 { font-size: 32px; font-weight: 600; }
  .hello p { color: var(--body); margin: 8px 0 0; font-size: 16px; }
  .bigin { width: 100%; max-width: 720px; background: var(--surface); border-radius: 24px; box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(43,16,24,.06); padding: 14px 14px 10px 20px; }
  .bigin textarea { width: 100%; border: 0; resize: none; background: transparent; font-size: 16px; color: var(--ink); outline: none; min-height: 56px; }
  .binrow { display: flex; align-items: center; gap: 8px; }
  .binrow .hint { font-size: 12px; color: var(--muted); }
  .sendc { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--wine); color: #FDFAF7; font-size: 16px; }
  .sendc:disabled { opacity: .35; cursor: default; }
  .att { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 17px; }
  .att:hover { background: var(--beige); }
  .sugg { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; max-width: 720px; }
  .sugg button { border: 1px solid var(--beige-d); background: transparent; color: var(--body); padding: 8px 14px; border-radius: 980px; font-size: 13px; }
  .sugg button:hover { border-color: var(--wine); color: var(--wine); }
  .opencases { width: 100%; max-width: 720px; margin-top: 40px; }
  .opencases h3 { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: 0; margin-bottom: 10px; }
  .ocgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .oc { text-align: left; border: 0; background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--line); }
  .oc:hover { box-shadow: 0 0 0 1.5px var(--wine); }
  .oc b { display: block; font-size: 15px; margin-bottom: 4px; } .oc span { font-size: 13px; color: var(--muted); }
  .oc .ostep { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--wine); background: var(--wine-tint); padding: 3px 9px; border-radius: 980px; }

  /* ---------- chat ---------- */
  .thread { flex: 1; overflow-y: auto; padding: 26px 24px 8px; }
  .inner { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

    [S('approval'), 'Property manager approves', c.approval ? (c.approval.by.startsWith('Automatic') ? 'Approved automatically' : `Approved at ${c.approval.t}`) : ''],
    [S('partner'), `${pn} accepts`, c.proposal ? `${firstName(c.tech)} proposed ${c.proposal}` : ''],
    [S('confirm'), 'You confirm the time', c.slot || ''],
    [resolved ? 'skip' : c.stage === 'booked' ? 'now' : ['feedback', 'closed'].includes(c.stage) ? 'done' : 'pending', 'Visit and repair', visitSub],
    [resolved || c.stage === 'closed' ? 'done' : (c.stage === 'feedback' ? 'now' : 'pending'), 'Done', c.stage === 'closed' ? 'Report filed on your home record' : resolved ? 'Fixed without a technician' : (c.feedback === 'fixed' ? 'Finishing the paperwork' : c.stage === 'feedback' ? 'Is everything working again?' : '')]
  ];
  if (c.stage === 'emergency') rows.splice(1, rows.length - 1, ['now', 'Emergency: gas smell', 'Leave the flat. Your property manager was alerted.']);
  return `<aside class="panel"><h2>${esc(c.title)}</h2><div class="psub">Case ${c.id} · ${esc(p.street)}, ${esc(p.floor)}</div>
    <ol class="flow">${rows.map(([s, t, sub], n) => `<li class="${s}"><span class="fd">${s === 'done' ? '✓' : n + 1}</span><div class="ft"><b>${esc(t)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></li>`).join('')}</ol>
    ${c.tech ? `<div class="pbox"><h4>Technician</h4><div class="big"><div class="tav" style="width:36px;height:36px">${esc(c.tech[0])}</div><div><b style="font-size:14px">${esc(c.tech)}</b><span style="font-size:13px">${esc(partner(c.partnerId).name)}</span></div></div></div>` : ''}
    <div class="pbox"><h4>Your home</h4><dl><dt>Boiler</dt><dd>${esc(p.device)}</dd><dt>Last service</dt><dd>${esc(p.service)}</dd><dt>Landlord</dt><dd>${esc(p.owner)}</dd></dl></div></aside>`;
}
function renderCase(id) {
  const c = caseById(id); if (!c || c.propertyId !== me_().id) { location.hash = ''; return; }
  const L = STAGE_LABEL[c.stage], closed = CLOSED.includes(c.stage);
  let h = '';
  c.messages.forEach(m => {
    if (m.who === 'note') return;
    if (m.who === 'me') h += `<div class="row me"><div style="display:flex;flex-direction:column;align-items:flex-end;max-width:75%"><div class="ubub">${m.photo ? shot(m.photo) : m.html}</div><div class="meta">${m.t}${m.src === 'WhatsApp' ? '<span class="via">via WhatsApp</span>' : ''}</div></div></div>`;
    else h += `<div class="row"><div class="bav"></div><div><div class="btext"><div class="bname">Debye</div>${m.html}${cardHTML(c, m)}</div><div class="meta">${m.t}</div></div></div>`;
  });
  if (!closed && c.qr && c.qr.length) {
    if (c.stage === 'avail') h += `<div class="actions">${c.qr.filter(q => q.act === 'avail').map(q => `<button class="chip ${c.availSel.includes(q.a[0]) ? 'on' : ''}" data-act="avail" data-a='${JSON.stringify(q.a)}'>${esc(AV.find(a => a.id === q.a[0]).l)}</button>`).join('')}
        <button class="chip solid" data-act="avail_send" ${c.availSel.length ? '' : 'disabled style="opacity:.4"'}>Send my times</button></div>`;
    else h += `<div class="actions">${c.qr.map((q, n) => q.act === 'photo' ? `<label class="chip solid" style="cursor:pointer">📷 Upload photo<input type="file" accept="image/*" data-photo style="display:none"></label>`
        : `<button class="chip ${n === 0 ? 'solid' : ''}" data-act="${q.act}" data-a='${JSON.stringify(q.a || [])}'>${esc(q.label)}</button>`).join('')}</div>`;
  }
  const composer = closed ? `<div class="composer"><div class="closedbar"><span>This case is ${c.stage === 'closed' || c.stage === 'resolved' ? 'closed' : 'with your property manager'}. Something else broken?</span><button data-new>Report a new problem</button></div></div>`
    : `<form class="composer" id="composer"><div class="cin"><label class="att" title="Add a photo">📎<input type="file" id="file" accept="image/*" style="display:none"></label>
        <textarea id="msg" rows="1" placeholder="Message Debye…"></textarea><button class="sendc" type="submit" aria-label="Send">➤</button></div>
        <div class="cnote">Same conversation as your WhatsApp with Debye. Answer wherever is easier.</div></form>`;
  const prevScroll = $('thread') ? $('thread').scrollTop : null, wasBottom = $('thread') ? $('thread').scrollHeight - $('thread').scrollTop - $('thread').clientHeight < 80 : true;
  const draft = $('msg') ? $('msg').value : '';
  $('root').innerHTML = `<div class="shell">${topbar(c.id)}<div class="app withpanel"><main><div class="topline"><button class="back" data-new title="Home">‹</button><div><b>${esc(c.title)}</b><br><span>Case ${c.id} · opened ${esc(c.opened)}</span></div><span class="stpill ${closed && c.stage !== 'emergency' ? 'ok' : ''}">${L[0]}</span></div>
    <div class="thread" id="thread"><div class="inner">${h}</div></div>${composer}</main>${progress(c)}</div></div>`;
  const t = $('thread'); t.scrollTop = wasBottom || OPEN !== c.id ? t.scrollHeight : prevScroll; OPEN = c.id;
  document.querySelectorAll('.inner [data-act]').forEach(b => b.onclick = () => commit(st => tenantInput(caseById(c.id), b.dataset.act, JSON.parse(b.dataset.a || '[]'), 'Website')));
  document.querySelectorAll('[data-photo]').forEach(f => f.onchange = () => commit(st => photo(caseById(c.id), 'Website')));
  if ($('composer')) {
    const ta = $('msg'); ta.value = draft; if (draft) ta.focus();
    $('composer').onsubmit = e => { e.preventDefault(); const v = ta.value.trim(); if (!v) return; ta.value = ''; commit(st => tenantText(st, caseById(c.id), v, 'Website')); };
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } };
    $('file').onchange = () => commit(st => { const cc = caseById(c.id); if (cc.stage === 'diag' && TREE[cc.node].photo) photo(cc, 'Website'); else { cc.messages.push({ who: 'me', photo: 'mixer', html: 'photo.jpg', t: nowT(), src: 'Website' }); ev(cc, 'Extra photo added', 'Website'); bot(cc, 'Thanks, added to your case.'); } });
  }
}

function render() {
  if (!me_()) return renderLogin();
  const id = hroute(); if (id) renderCase(id); else { OPEN = null; renderHome(); }
}
document.addEventListener('click', e => {
  const cs = e.target.closest('[data-case]'); if (cs) { location.hash = 'case/' + cs.dataset.case; return; }
  if (e.target.closest('[data-new]')) { location.hash = ''; render(); return; }
  if (e.target.closest('[data-logout]')) { sessionStorage.removeItem(SKEY); location.hash = ''; render(); }
});
function onStore() { const a = document.activeElement; if (a && a.id === 'newtext') return; render(); }
render();
</script>
</body>
