<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round 3 vs round 4</title>
<link rel="stylesheet" href="polish.css">
<style>
  main { max-width: 1600px; margin: 0 auto; padding: 32px 32px 80px; }
  .row { margin-top: 48px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 12px; }
  .pair figure { margin: 0; min-width: 0; }
  .pair figcaption { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .pair figcaption b { color: var(--ink); font-weight: 500; }
  .pair img { width: 100%; display: block; border-radius: var(--r-panel); box-shadow: var(--card); }
  .phones img { width: 300px; }
  @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } main { padding: 16px; } }
</style></head>
<body><main>
  <h1 class="h1">Round 3 vs round 4, head to head</h1>
  <p class="body" style="margin:8px 0 0">Left: the version before (Lexend, square corners, your rules). Right: the version after the independent critique.</p>

  <section class="row"><h2 class="h2">Staff case</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/staff-case-1-top.jpg" alt="Staff case, round 3"></figure>
    <figure><figcaption><b>Round 4</b></figcaption><img src="after/staff-case-1-top.jpg" alt="Staff case, round 4"></figure>
  </div></section>

  <section class="row"><h2 class="h2">Staff case, lower half</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/staff-case-2-lower.jpg" alt=""></figure>

  </div></section>

  <section class="row"><h2 class="h2">Staff inbox</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/staff-inbox.jpg" alt=""></figure>
    <figure><figcaption><b>Round 4</b></figcaption><img src="after/staff-inbox.jpg" alt=""></figure>
  </div></section>

  <section class="row"><h2 class="h2">Partner, new job</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/partner-new-job.jpg" alt=""></figure>
    <figure><figcaption><b>Round 4</b></figcaption><img src="after/partner-new-job.jpg" alt=""></figure>
  </div></section>

  <section class="row"><h2 class="h2">Partner welcome</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/partner-welcome.jpg" alt=""></figure>
    <figure><figcaption><b>Round 4</b></figcaption><img src="after/partner-welcome.jpg" alt=""></figure>
  </div></section>

  <section class="row"><h2 class="h2">Tenant home</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/tenant-home-desktop.jpg" alt=""></figure>

  <section class="row"><h2 class="h2">Phone, 375 px</h2><div class="pair">
    <figure class="phones"><figcaption><b>Round 3</b>: tenant, staff case</figcaption><div style="display:flex;gap:12px"><img src="after-round3/tenant-home-375.jpg" alt=""><img src="after-round3/staff-case-375.jpg" alt=""></div></figure>

  <section class="row"><h2 class="h2">States</h2><div class="pair">
    <figure><figcaption><b>Round 3</b></figcaption><img src="after-round3/states.jpg" alt=""></figure>
