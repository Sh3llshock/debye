<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Debye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
  /* colours from frontend/src/theme.ts */
  :root { --bg:#FAF6F2; --surface:#FFFFFF; --line:#E7DFD7; --ink:#1A1A1A; --heading:#330933;
          --muted:#6B6B6B; --plum:#330933; --violet:#8332AC; --violet-soft:#F1E6F7;
          --danger:#B42318; --success:#1E7A46; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "IBM Plex Sans", system-ui, sans-serif;
         min-height:100vh; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line);
         border-radius:20px; padding:28px 24px; text-align:center; }
  img.mascot { width:132px; height:132px; object-fit:contain; }
  h1 { font-family:"Libre Baskerville", Georgia, serif; color:var(--heading); font-size:26px; margin:8px 0 2px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:14px 28px; cursor:pointer;
           color:#fff; background:var(--plum); min-width:200px; }
  button.end { background:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin:14px 0 0; color:var(--muted); min-height:24px; }
  #status.live { color:var(--success); }
  .pulse { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--success);
           margin-right:6px; animation:p 1.2s infinite; vertical-align:middle; }
  @keyframes p { 50% { opacity:.25; } }
  #log { text-align:left; margin-top:20px; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { padding:8px 12px; border-radius:14px; max-width:85%; font-size:15px; }
  .ai { background:var(--violet-soft); align-self:flex-start; }
  .user { background:#EFEAE2; align-self:flex-end; }
  .who { margin-top:18px; font-size:14px; color:var(--muted); }
  select { font:inherit; padding:4px 8px; border-radius:8px; border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <img class="mascot" src="/mascot/debye-mascot-waving.png" alt="" onerror="this.style.display='none'">
  <h1>Call Debye</h1>
  <p class="sub">AI assistant by reltix · same case as on WhatsApp</p>
  <button id="btn">📞 Call</button>
  <div id="status"></div>
  <div id="log"></div>
  <p class="who">Call as
    <select id="contact">
      <option value="c_202">Luka (4B)</option>
      <option value="c_203">Jonas Weber (2A)</option>
    </select>
  </p>
</main>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/+esm";

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const sel = document.getElementById("contact");
const params = new URLSearchParams(location.search);
if (params.get("contact")) sel.value = params.get("contact");

let conversation = null;
let conversationId = null;

function status(text, live = false) {
  statusEl.className = live ? "live" : "";
  statusEl.innerHTML = (live ? '<span class="pulse"></span>' : "") + text;
}
function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

async function start() {
  btn.disabled = true;
  status("Connecting …");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const r = await fetch(`/api/voice/signed_url?contact=${encodeURIComponent(sel.value)}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const { signed_url } = await r.json();
    logEl.innerHTML = "";
    conversation = await Conversation.startSession({
      signedUrl: signed_url,
      dynamicVariables: { contact_id: sel.value },
      onConnect: () => { status("Connected – just start talking", true); btn.textContent = "Hang up"; btn.className = "end"; btn.disabled = false; },
      onMessage: (m) => { if (m && m.message) add(m.source === "user" ? "user" : "ai", m.message); },
      onModeChange: (m) => { if (conversation) status(m.mode === "speaking" ? "Debye is speaking …" : "Debye is listening …", true); },
      onDisconnect: () => ended(),
      onError: (e) => { console.error(e); status("Error: " + (e && e.message ? e.message : e)); },
    });
    conversationId = conversation.getId();
  } catch (e) {
    console.error(e);
    status("Could not connect: " + (e.message || e));
    btn.disabled = false;
  }
}

async function ended() {
  const id = conversationId || (conversation && conversation.getId && conversation.getId());
  conversation = null;
  btn.textContent = "📞 Call again"; btn.className = ""; btn.disabled = false;
  status("Call ended. Debye will follow up on WhatsApp in a moment.");
  if (id) {
    try { await fetch(`/api/voice/calls/${encodeURIComponent(id)}/end`, { method: "POST" }); } catch (e) { console.error(e); }
  }
}

btn.addEventListener("click", async () => {
  if (conversation) { btn.disabled = true; await conversation.endSession(); }
  else start();
});
</script>
</body>
</html>
