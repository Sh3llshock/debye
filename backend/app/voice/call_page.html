<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Debye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  /* v3 tokens, same values as frontend/src/theme.ts */
  :root { --bg:#FAF8F5; --surface:#FDFCFA; --ink:#2B1018; --body:#5A4744; --muted:#8E807A; --line:rgba(74,20,36,.10);
          --wine:#6B1F33; --wine-d:#571828; --wine-tint:#F5EBED; --beige:#EFE8DF; --beige-d:#E2D8CB;
          --ok:#2F7D4F; --red:#C0262D; --cream:#FDFAF7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; display:flex; align-items:center; gap:9px; padding:12px 28px; border-bottom:1px solid var(--line);
           font:600 19px Inter, sans-serif; letter-spacing:-.02em; }
  header img { width:28px; height:28px; }
  header small { font:500 12px Inter, sans-serif; color:var(--muted); margin-left:2px; letter-spacing:0; }
  main { width:calc(100% - 32px); max-width:440px; margin:32px 16px; background:var(--surface); border-radius:16px;
         box-shadow:0 0 0 1px var(--line), 0 1px 3px rgba(43,16,24,.03); padding:28px 24px; text-align:center; }
  img.logo { width:72px; height:72px; border-radius:50%; }
  h1 { color:var(--ink); font-size:30px; font-weight:700; letter-spacing:-.02em; margin:12px 0 2px; }
  .sub { color:var(--body); margin:0 0 20px; }
  button { font:inherit; font-weight:500; font-size:15px; border:0; border-radius:980px; padding:13px 28px; cursor:pointer;
           color:var(--cream); background:var(--wine); min-width:200px; }
  button:hover { background:var(--wine-d); }
  button.end { background:var(--red); }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin:14px 0 0; color:var(--muted); min-height:24px; }
  #status.live { color:var(--ok); }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok);
           margin-right:6px; animation:p 1.2s infinite; vertical-align:middle; }
  @keyframes p { 50% { opacity:.25; } }
  #log { text-align:left; margin-top:20px; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
         background:#EFEAE2; border-radius:16px; padding:0; }
  #log:not(:empty) { padding:16px; }
  .msg { padding:8px 12px; border-radius:12px; max-width:78%; font-size:14px; box-shadow:0 1px .5px rgba(0,0,0,.1); }
  .ai { background:var(--surface); align-self:flex-start; }
  .user { background:#D9FDD3; align-self:flex-end; }
  .who { margin-top:18px; font-size:13px; color:var(--muted); }
  select { font:inherit; padding:5px 10px; border-radius:980px; border:0; background:var(--beige); color:var(--ink); }
</style>
</head>
<body>
<header><img src="/brand/debye-logo.png" alt="" onerror="this.style.display='none'">Debye<small>Tenant line</small></header>
<main>
  <img class="logo" src="/brand/debye-avatar.png" alt="" onerror="this.style.display='none'">
  <h1>Call Debye</h1>
  <p class="sub">AI assistant by reltix · same case as on WhatsApp</p>
  <button id="btn">📞 Call</button>
  <div id="status"></div>
  <div id="log"></div>
  <p class="who">Call as
    <select id="contact">
      <option value="c_202">Luka (4B)</option>
      <option value="c_203">Jonas Weber (2A)</option>
    </select>
  </p>
</main>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.32.1/+esm";

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const sel = document.getElementById("contact");
const params = new URLSearchParams(location.search);
if (params.get("contact")) sel.value = params.get("contact");

let conversation = null;
let conversationId = null;

function status(text, live = false) {
  statusEl.className = live ? "live" : "";
  statusEl.innerHTML = (live ? '<span class="pulse"></span>' : "") + text;
}
function add(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

async function start() {
  btn.disabled = true;
  status("Connecting …");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const r = await fetch(`/api/voice/signed_url?contact=${encodeURIComponent(sel.value)}`);
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const { signed_url, dynamic_variables } = await r.json();
    logEl.innerHTML = "";
    conversation = await Conversation.startSession({
      signedUrl: signed_url,
      dynamicVariables: { ...(dynamic_variables || {}), contact_id: sel.value },
      onConnect: () => { status("Connected – just start talking", true); btn.textContent = "Hang up"; btn.className = "end"; btn.disabled = false; },
      onMessage: (m) => { if (m && m.message) add(m.source === "user" ? "user" : "ai", m.message); },
      onModeChange: (m) => { if (conversation) status(m.mode === "speaking" ? "Debye is speaking …" : "Debye is listening …", true); },
      onDisconnect: () => ended(),
      onError: (e) => { console.error(e); status("Error: " + (e && e.message ? e.message : e)); },
    });
    conversationId = conversation.getId();
  } catch (e) {
    console.error(e);
    status("Could not connect: " + (e.message || e));
    btn.disabled = false;
  }
}

async function ended() {
  const id = conversationId || (conversation && conversation.getId && conversation.getId());
  conversation = null;
  btn.textContent = "📞 Call again"; btn.className = ""; btn.disabled = false;
  status("Call ended. Debye will follow up on WhatsApp in a moment.");
  if (id) {
    try { await fetch(`/api/voice/calls/${encodeURIComponent(id)}/end`, { method: "POST" }); } catch (e) { console.error(e); }
  }
}

btn.addEventListener("click", async () => {
  if (conversation) { btn.disabled = true; await conversation.endSession(); }
  else start();
});
</script>
</body>
</html>
